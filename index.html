<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FF Arena Tournament</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0f1117;color:#fff;padding-bottom:70px}
header{background:#ff6a00;padding:14px;text-align:center;font-size:20px;font-weight:bold}
.wrap{padding:14px}
.card{background:#1b1f2a;border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin-bottom:6px}
.muted{color:#9aa3b5;font-size:14px}
.tag{display:inline-block;background:#2b3245;border-radius:8px;padding:3px 8px;font-size:12px;margin-right:6px}
.free{background:#1f7a3d}
input,select{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#0f1117;color:#fff;font-size:15px}
button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:8px;background:#ff6a00;color:#fff;font-size:16px;font-weight:bold}
button.sec{background:#2b3245}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1b1f2a;border-top:1px solid #333}
nav div{flex:1;text-align:center;padding:14px 4px;font-size:14px;color:#9aa3b5}
nav div.on{color:#ff6a00;font-weight:bold}
.bal{font-size:34px;font-weight:bold;color:#ffb347}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2b3245;font-size:14px}
.plus{color:#4cd964}.minus{color:#ff5b5b}
.msg{background:#3a1f1f;color:#ff9a9a;padding:10px;border-radius:8px;margin-bottom:10px}
.ok{background:#1f3a26;color:#9aff9a}
</style>
</head>
<body>
<header>FF Arena Tournament</header>
<div class="wrap" id="app"></div>
<nav id="nav" style="display:none"></nav>

<script>
var KEY = "ffarena_v1";
var state = load();
var tab = "home";
var openId = null;
var notice = null;

function defaults(){
  return {
    user: null,
    balance: 0,
    history: [],
    joined: [],
    tournaments: [
      {id:"1",title:"Free Solo Rush",mode:"Solo",fee:0,prize:500,time:"आज रात 8:00",room:"FF778899",pass:"arena1"},
      {id:"2",title:"Duo Battle",mode:"Duo",fee:20,prize:1500,time:"आज रात 9:00",room:"FF112233",pass:"arena2"},
      {id:"3",title:"Squad War",mode:"Squad",fee:50,prize:5000,time:"कल शाम 7:00",room:"FF445566",pass:"arena3"}
    ]
  };
}
function load(){
  try{ var s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  return defaults();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function esc(t){ var d=document.createElement("div"); d.textContent=t; return d.innerHTML; }
function find(id){ return state.tournaments.filter(function(t){return t.id===id;})[0]; }
function isJoined(id){ return state.joined.indexOf(id)>-1; }
function go(t){ tab=t; openId=null; notice=null; render(); }
function say(text,good){ notice={text:text,good:good}; }

function login(){
  var n=document.getElementById("nm").value.trim();
  var p=document.getElementById("ph").value.trim();
  if(!n || p.length!==10 || isNaN(p)){ say("नाम और 10 अंकों का मोबाइल नंबर डालिए"); render(); return; }
  state.user={name:n,phone:p}; save(); notice=null; render();
}
function logout(){ state.user=null; save(); render(); }

function joinT(id){
  var t=find(id);
  if(!t || isJoined(id)) return;
  if(t.fee>0){
    if(state.balance<t.fee){ say("वॉलेट में बैलेंस कम है, पहले पैसे जोड़ें"); tab="wallet"; openId=null; render(); return; }
    state.balance-=t.fee;
    state.history.unshift({title:"एंट्री फीस: "+t.title,amt:-t.fee});
  }
  state.joined.push(id); save(); say("जॉइन हो गया!",true); render();
}

function addMoney(){
  var v=parseInt(document.getElementById("amt").value,10);
  if(!v || v<=0){ say("सही रकम डालिए"); render(); return; }
  state.balance+=v;
  state.history.unshift({title:"वॉलेट में पैसे जमा (टेस्ट)",amt:v});
  save(); say("₹"+v+" जुड़ गए",true); render();
}

function createT(){
  var g=function(i){return document.getElementById(i).value.trim();};
  if(!g("a_title")){ say("टूर्नामेंट का नाम डालिए"); render(); return; }
  state.tournaments.unshift({
    id:String(Date.now()), title:g("a_title"), mode:g("a_mode"),
    fee:parseInt(g("a_fee"),10)||0, prize:parseInt(g("a_prize"),10)||0,
    time:g("a_time"), room:g("a_room"), pass:g("a_pass")
  });
  save(); say("टूर्नामेंट बन गया",true); render();
}
function payPrize(id){
  var v=parseInt(document.getElementById("a_win").value,10);
  var t=find(id);
  if(!v || v<=0 || !t){ say("विजेता को इनाम की सही रकम डालिए"); render(); return; }
  state.balance+=v;
  state.history.unshift({title:"इनाम: "+t.title,amt:v});
  save(); say("₹"+v+" इनाम वॉलेट में आ गया",true); render();
}
function delT(id){
  state.tournaments=state.tournaments.filter(function(t){return t.id!==id;});
  state.joined=state.joined.filter(function(j){return j!==id;});
  save(); render();
}
function resetAll(){
  if(confirm("सारा डेटा मिटाकर शुरू से करें?")){ state=defaults(); save(); tab="home"; render(); }
}

function card(t){
  var f = t.fee===0 ? '<span class="tag free">फ्री</span>' : '<span class="tag">एंट्री ₹'+t.fee+'</span>';
  return '<div class="card" onclick="openId=\''+t.id+'\';notice=null;render()">'+
    '<h3>'+esc(t.title)+'</h3>'+
    '<div class="muted">'+esc(t.mode)+' • '+esc(t.time)+'</div>'+
    '<div style="margin-top:8px"><span class="tag">इनाम ₹'+t.prize+'</span>'+f+
    (isJoined(t.id)?'<span class="tag free">जॉइन्ड</span>':'')+'</div></div>';
}

function viewDetail(t){
  var h='<button class="sec" onclick="openId=null;notice=null;render()">← वापस</button>';
  h+='<div class="card" style="margin-top:10px"><h3>'+esc(t.title)+'</h3>'+
     '<div class="muted">मोड: '+esc(t.mode)+'</div>'+
     '<div class="muted">समय: '+esc(t.time)+'</div>'+
     '<div class="muted">इनाम: ₹'+t.prize+'</div>'+
     '<div class="muted">एंट्री: '+(t.fee===0?'फ्री':'₹'+t.fee)+'</div></div>';
  if(isJoined(t.id)){
    h+='<div class="card"><h3>आप जॉइन हो चुके हैं</h3><div>रूम आईडी: <b>'+esc(t.room)+'</b></div><div>पासवर्ड: <b>'+esc(t.pass)+'</b></div></div>';
  } else {
    h+='<button onclick="joinT(\''+t.id+'\')">'+(t.fee===0?'फ्री में जॉइन करें':'₹'+t.fee+' देकर जॉइन करें')+'</button>';
  }
  return h;
}

function viewHome(){
  if(openId && find(openId)) return viewDetail(find(openId));
  var h='<h2 style="margin-bottom:10px">टूर्नामेंट</h2>';
  if(!state.tournaments.length) h+='<div class="muted">अभी कोई टूर्नामेंट नहीं है</div>';
  state.tournaments.forEach(function(t){ h+=card(t); });
  return h;
}
function viewMine(){
  if(openId && find(openId)) return viewDetail(find(openId));
  var mine=state.tournaments.filter(function(t){return isJoined(t.id);});
  var h='<h2 style="margin-bottom:10px">मेरे मैच</h2>';
  if(!mine.length) h+='<div class="muted">आपने अभी कोई टूर्नामेंट जॉइन नहीं किया है</div>';
  mine.forEach(function(t){ h+=card(t)+'<div class="muted" style="margin:-6px 0 12px 4px">रूम आईडी: '+esc(t.room)+' | पासवर्ड: '+esc(t.pass)+'</div>'; });
  return h;
}
function viewWallet(){
  var h='<h2 style="margin-bottom:10px">मेरा वॉलेट</h2><div class="card"><div class="muted">बैलेंस</div><div class="bal">₹'+state.balance+'</div></div>';
  h+='<div class="card"><input id="amt" type="number" placeholder="रकम (₹)"><button onclick="addMoney()">पैसे जोड़ें (टेस्ट)</button></div>';
  h+='<h3 style="margin:8px 0">लेन-देन</h3><div class="card">';
  if(!state.history.length) h+='<div class="muted">अभी कोई लेन-देन नहीं</div>';
  state.history.forEach(function(x){
    h+='<div class="row"><span>'+esc(x.title)+'</span><span class="'+(x.amt>0?'plus':'minus')+'">'+(x.amt>0?'+₹'+x.amt:'-₹'+(-x.amt))+'</span></div>';
  });
  return h+'</div>';
}
function viewAdmin(){
  var h='<h2 style="margin-bottom:10px">एडमिन पैनल</h2><div class="card"><h3>नया टूर्नामेंट बनाएँ</h3>'+
  '<input id="a_title" placeholder="टूर्नामेंट का नाम">'+
  '<select id="a_mode"><option>Solo</option><option>Duo</option><option>Squad</option></select>'+
  '<input id="a_fee" type="number" placeholder="एंट्री फीस (0 = फ्री)">'+
  '<input id="a_prize" type="number" placeholder="कुल इनाम (₹)">'+
  '<input id="a_time" placeholder="शुरू होने का समय">'+
  '<input id="a_room" placeholder="रूम आईडी">'+
  '<input id="a_pass" placeholder="रूम पासवर्ड">'+
  '<button onclick="createT()">टूर्नामेंट बनाएँ</button></div>';
  h+='<div class="card"><h3>इनाम बाँटें</h3><input id="a_win" type="number" placeholder="विजेता को इनाम (₹)">';
  state.tournaments.forEach(function(t){
    h+='<button class="sec" onclick="payPrize(\''+t.id+'\')">'+esc(t.title)+' - इनाम दें</button>'+
       '<button class="sec" style="background:#4a2020" onclick="delT(\''+t.id+'\')">'+esc(t.title)+' - हटाएँ</button>';
  });
  h+='</div><button class="sec" onclick="logout()">लॉग आउट</button><button class="sec" style="background:#4a2020" onclick="resetAll()">सारा डेटा मिटाएँ</button>';
  return h;
}
function viewLogin(){
  return '<div class="card" style="margin-top:30px"><h2 style="margin-bottom:10px">लॉगिन</h2>'+
  '<input id="nm" placeholder="गेम में आपका नाम">'+
  '<input id="ph" type="tel" maxlength="10" placeholder="मोबाइल नंबर (10 अंक)">'+
  '<button onclick="login()">लॉगिन</button></div>';
}

function render(){
  var app=document.getElementById("app");
  var nav=document.getElementById("nav");
  var n = notice ? '<div class="msg '+(notice.good?'ok':'')+'">'+esc(notice.text)+'</div>' : '';
  if(!state.user){ nav.style.display="none"; app.innerHTML=n+viewLogin(); return; }
  nav.style.display="flex";
  var tabs=[["home","होम"],["mine","मेरे मैच"],["wallet","वॉलेट"],["admin","एडमिन"]];
  nav.innerHTML=tabs.map(function(x){
    return '<div class="'+(tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</div>';
  }).join("");
  var body = tab==="home"?viewHome(): tab==="mine"?viewMine(): tab==="wallet"?viewWallet(): viewAdmin();
  app.innerHTML=n+body;
}
render();
</script>
</body>
</html>
